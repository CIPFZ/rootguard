name: CI

on:
  push:
    branches: [main]
    # v* tag：在检查与打包通过后把三平台安装包上传为 GitHub Release 资产（SPEC 20.3，ADR-011）
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖（rodio / eframe）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo doc
        run: cargo doc --workspace --no-deps

      - name: 依赖规则 R1 ～ R3
        if: runner.os != 'Windows'
        run: ./scripts/check_deps.sh

      - name: 知识产权禁用词
        if: runner.os != 'Windows'
        run: ./scripts/check_ip.sh

      - name: 打包（发布构建，不带 devtools，SPEC 17 G5）
        if: github.event_name == 'push'
        shell: bash
        run: ./scripts/package.sh

      - name: 上传安装包
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: rootguard-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

      - name: README 截图（Xvfb，占位 / 皮肤）
        if: github.event_name == 'push' && runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb imagemagick libgl1-mesa-dri
          ./scripts/screenshot.sh --out dist/screenshots

      - name: 上传截图
        if: github.event_name == 'push' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: rootguard-screenshots
          path: dist/screenshots/*.png
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 核对 tag 与 workspace 版本
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 Cargo.toml 版本 ${version} 不一致" >&2
            exit 1
          fi

      - name: 从 CHANGELOG.md 提取发布说明
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md 中没有 ${version} 的条目" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: rootguard-*-latest
          path: dist
          merge-multiple: true

      - name: 创建 Release 并上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip \
              --verify-tag --title "Rootguard ${GITHUB_REF_NAME}" --notes-file release-notes.md
          fi
