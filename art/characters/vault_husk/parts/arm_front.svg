<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 160">
  <!-- 一条手臂长成了芦苇杆（专属色 reed，ART-SPEC 5.5），斜持，顶端蓬松下垂的芦花；长在芦苇塘边（LORE）；附件长在身上（1.5） -->
  <g transform="translate(-4 12)">
    <path d="M53 80 C49 91 47 101 46 110 C46 113.5 51 114.5 52.5 111.5 C53.5 102 56 92 60 83 Z" fill="@straw" stroke="@husk_outline" stroke-width="2.6" stroke-linejoin="round"/>
  </g>
  <!-- 杆沿自身方向下移，满足 1.4 的 130 px 上限 -->
  <g transform="translate(3 13)">
  <g fill="none" stroke-linecap="round">
    <path d="M58 138 L34 34" stroke="@husk_outline" stroke-width="6.4"/>
    <path d="M58 138 L34 34" stroke="@reed" stroke-width="3.2"/>
  </g>
  <g fill="none" stroke="@husk_outline" stroke-width="1.6" stroke-linecap="round">
    <path d="M51 114 L55 113"/><path d="M45 90 L49 89"/><path d="M39 64 L43 63"/>
  </g>
  <!-- 沿杆长出的两片窄叶：杆是长在身上的芦苇，不是拿着的东西 -->
  <g stroke="@husk_outline" stroke-width="1.8" stroke-linejoin="round">
    <path d="M47 96 C51 88 57 84 63 84 C59 90 53 94 47 96 Z" fill="@reed.shade"/>
    <path d="M40 66 C34 62 28 62 23 65 C28 68 34 68 40 66 Z" fill="@reed.shade"/>
  </g>
  <!-- 芦花：一条蓬松、向后弯垂的绒穗（不是尖头） -->
  <path d="M34 36 C31 28 32 19 38 14 C44 10 50 13 49 19 C48 26 42 32 34 36 Z" fill="@straw" stroke="@husk_outline" stroke-width="2" stroke-linejoin="round"/>
  <path d="M36 33 C40 29 44 24 45 18" fill="none" stroke="@straw_dark" stroke-width="1.4" stroke-linecap="round"/>
  <g fill="none" stroke="@straw_dark" stroke-width="1.2" stroke-linecap="round">
    <path d="M38 22 L35 20"/><path d="M41 18 L39 15"/><path d="M42 27 L46 27"/><path d="M38 30 L40 33"/>
  </g>
  </g>
</svg>
