  <g transform="translate(45 105) rotate(-14) scale(0.85) translate(-48 -84) translate(0 -5)">
    <path d="M28 58 L34 28 C40 26 54 25 62 28 L70 56 C58 60 40 61 28 58 Z" fill="@terracotta"/>
    <path d="M28 58 L34 28 C37 27 40 26.5 43 26.4 L39 60 C35 59.6 31 59 28 58 Z" fill="@terracotta.shade"/>
    <path d="M27 55 C40 58.6 58 58 71 53 L72 59 C58 64 40 64.6 26 61 Z" fill="@terracotta" stroke="@husk_outline" stroke-width="2.4" stroke-linejoin="round"/>
    <ellipse cx="48" cy="28" rx="4" ry="1.4" fill="@bark_dark"/>
    <path d="M54 27 L52 36 L56 42 L53 50" fill="none" stroke="@husk_outline" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28 58 L34 28 C40 26 54 25 62 28 L70 56 C58 60 40 61 28 58 Z" fill="none" stroke="@husk_outline" stroke-width="3" stroke-linejoin="round"/>
