[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# 内部 crate
rootguard-core = { path = "crates/rootguard-core" }
rootguard-content = { path = "crates/rootguard-content" }

# Trellia 引擎：git + rev 锁定（SPEC.md 3.1 R3）。三项指向同一仓库同一 rev，
# rootguard-core / rootguard-content 直接依赖子 crate 以满足 R1（ADR-001）。
trellia = { git = "https://github.com/CIPFZ/trellia", rev = "24c4d712ff3c157dad12ac7d50836476e699b8fa", default-features = false }
trellia-core = { git = "https://github.com/CIPFZ/trellia", rev = "24c4d712ff3c157dad12ac7d50836476e699b8fa" }
trellia-assets = { git = "https://github.com/CIPFZ/trellia", rev = "24c4d712ff3c157dad12ac7d50836476e699b8fa" }

# 第三方（引擎白名单 + directories，SPEC.md 0.3；版本与引擎一致）
anyhow = "1.0.104"
directories = "6.0.0"
env_logger = "0.11.11"
log = "0.4.34"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
must_use_candidate = "warn"
missing_errors_doc = "warn"

# tools/artgen 的渲染依赖在 debug 下也开启优化，否则 `art_assets_up_to_date` 等测试过慢（ADR-013）
[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.usvg]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3

[profile.dev.package.artgen]
opt-level = 2
